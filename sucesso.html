<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Aprovado · HYPE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { background:#080808; color:#f4f0e8; font-family:'DM Sans',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .box { text-align:center; padding:60px 40px; border:1px solid rgba(0,217,93,0.2); max-width:480px; }
  .icon { font-size:4rem; margin-bottom:24px; animation: pop 0.6s ease; }
  @keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:3rem; color:#00d95d; margin-bottom:12px; }
  p { color:#888880; margin-bottom:32px; line-height:1.6; }
  a { display:inline-block; background:#ff3c00; color:#fff; padding:14px 32px; text-decoration:none; font-weight:700; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🎉</div>
  <h1>PAGAMENTO APROVADO!</h1>
  <p>Seu pedido foi confirmado com sucesso.<br>Em breve você receberá um e-mail com os detalhes da entrega.</p>
  <a href="/">Continuar Comprando</a>
</div>
</body>
</html>
